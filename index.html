<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALLY-SHORE // ABI Strategic Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --abi-blue: #1C2938;
    --abi-blue-deep: #0F1822;
    --abi-blue-light: #2A3B4F;
    --abi-gold: #C9A961;
    --abi-gold-dim: #8A7440;
    --abi-bone: #E8E2D0;
    --abi-bone-dim: #A8A290;
    --abi-amber: #D97706;
    --abi-teal: #4A8B7E;
    --abi-oxblood: #8B2A2A;
    --grid: rgba(201, 169, 97, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--abi-blue-deep);
    color: var(--abi-bone);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px 32px;
  }
  /* Header strip */
  .brand {
    width: 100%;
    max-width: 680px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: var(--abi-blue);
    border: 1px solid var(--abi-gold-dim);
    border-bottom: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--abi-gold);
    text-transform: uppercase;
  }
  .brand .vault {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--abi-gold);
    border-radius: 50%;
    position: relative;
    vertical-align: middle;
    margin-right: 6px;
  }
  .brand .vault::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    background: var(--abi-gold);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .brand .right { color: var(--abi-bone-dim); }

  .title-bar {
    width: 100%;
    max-width: 680px;
    background: var(--abi-blue);
    border-left: 1px solid var(--abi-gold-dim);
    border-right: 1px solid var(--abi-gold-dim);
    padding: 18px 16px 14px;
    text-align: center;
  }
  .title-bar h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 8px;
    color: var(--abi-bone);
    line-height: 1;
  }
  .title-bar h1 span { color: var(--abi-gold); }
  .title-bar .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--abi-bone-dim);
    margin-top: 6px;
    text-transform: uppercase;
  }
  .classified {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 8px;
    background: var(--abi-oxblood);
    color: var(--abi-bone);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
  }

  /* Canvas wrapper */
  #stage {
    width: 100%;
    max-width: 680px;
    border-left: 1px solid var(--abi-gold-dim);
    border-right: 1px solid var(--abi-gold-dim);
    background: var(--abi-blue-deep);
    padding: 12px;
  }
  canvas {
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    display: block;
    border: 1px solid var(--abi-gold-dim);
  }

  /* HUD */
  #hud {
    width: 100%;
    max-width: 680px;
    background: var(--abi-blue);
    border: 1px solid var(--abi-gold-dim);
    border-top: none;
    padding: 12px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--abi-bone);
  }
  .hud-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 18px;
  }
  .hud-row {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px dotted var(--abi-blue-light);
    padding-bottom: 3px;
  }
  .hud-row .k {
    color: var(--abi-bone-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 9px;
  }
  .hud-row .v {
    color: var(--abi-gold);
    font-weight: 700;
  }
  .hud-row .v.warn { color: var(--abi-amber); }
  .hud-row .v.danger { color: var(--abi-oxblood); }
  .hud-row .v.good { color: var(--abi-teal); }

  /* Progress bar */
  .progress-wrap {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--abi-blue-light);
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--abi-bone-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 10px;
    background: var(--abi-blue-deep);
    border: 1px solid var(--abi-gold-dim);
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--abi-gold-dim), var(--abi-gold));
    transition: width 0.4s ease-out;
  }
  .milestones {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
    font-size: 8px;
    color: var(--abi-bone-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .milestone.hit { color: var(--abi-gold); }

  /* Controls */
  #controls {
    width: 100%;
    max-width: 680px;
    background: var(--abi-blue);
    border: 1px solid var(--abi-gold-dim);
    border-top: none;
    padding: 12px;
  }
  .event-text {
    background: var(--abi-blue-deep);
    border-left: 3px solid var(--abi-gold);
    padding: 10px 12px;
    margin-bottom: 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    line-height: 1.4;
    color: var(--abi-bone);
  }
  .event-text .tag {
    display: inline-block;
    padding: 2px 6px;
    background: var(--abi-gold);
    color: var(--abi-blue-deep);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .btn-grid {
    display: grid;
    gap: 6px;
  }
  .btn-grid.cols-2 { grid-template-columns: 1fr 1fr; }
  .btn-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  button {
    background: var(--abi-blue-deep);
    color: var(--abi-bone);
    border: 1px solid var(--abi-gold-dim);
    padding: 10px 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.12s ease;
    text-align: left;
  }
  button .sub {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--abi-bone-dim);
    margin-top: 2px;
    text-transform: none;
  }
  button:hover:not(:disabled) {
    border-color: var(--abi-gold);
    background: var(--abi-blue-light);
    transform: translateY(-1px);
  }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary {
    background: var(--abi-gold);
    color: var(--abi-blue-deep);
    border-color: var(--abi-gold);
  }
  button.primary:hover { background: var(--abi-bone); border-color: var(--abi-bone); }
  button.danger { border-color: var(--abi-oxblood); }
  button.danger:hover { background: var(--abi-oxblood); }

  /* Coalition panel */
  .coalition {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--abi-blue-light);
  }
  .member {
    background: var(--abi-blue-deep);
    border: 1px solid var(--abi-blue-light);
    padding: 4px;
    text-align: center;
    font-size: 9px;
  }
  .member .role {
    color: var(--abi-gold);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    line-height: 1.1;
    min-height: 22px;
  }
  .member .cred {
    margin-top: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--abi-bone);
  }
  .member.weak { border-color: var(--abi-amber); }
  .member.weak .cred { color: var(--abi-amber); }
  .member.gone { opacity: 0.3; border-color: var(--abi-oxblood); }
  .member.gone .cred { color: var(--abi-oxblood); }

  /* Footer */
  .footer {
    width: 100%;
    max-width: 680px;
    margin-top: 8px;
    padding: 6px 14px;
    background: var(--abi-blue);
    border: 1px solid var(--abi-gold-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--abi-bone-dim);
    display: flex;
    justify-content: space-between;
    text-transform: uppercase;
  }
  .footer button {
    background: transparent;
    border: 1px solid var(--abi-gold-dim);
    color: var(--abi-gold);
    padding: 4px 10px;
    font-size: 9px;
    letter-spacing: 1.5px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Status messages */
  .status-msg {
    margin-top: 6px;
    padding: 4px 8px;
    font-size: 10px;
    background: var(--abi-blue-deep);
    border-left: 2px solid var(--abi-teal);
    color: var(--abi-bone-dim);
  }
  .status-msg.bad { border-left-color: var(--abi-oxblood); }
  .status-msg.good { border-left-color: var(--abi-teal); color: var(--abi-bone); }
  .status-msg.warn { border-left-color: var(--abi-amber); }

  /* Animations */
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .classified { animation: flicker 3s infinite; }
</style>
</head>
<body>

<div class="brand">
  <div><span class="vault"></span>AMERICAN BIOSECURITY INITIATIVE</div>
  <div class="right">OPS // SIM-01</div>
</div>

<div class="title-bar">
  <h1>ALLY<span>·</span>SHORE</h1>

</div>

  <canvas id="game" width="320" height="180"></canvas>
</div>

<div id="hud"></div>
<div id="controls"></div>

<div class="footer">
  <span>BUILD 1.0 // ABI x LANCEA</span>
  <button id="audio-btn">♪ AUDIO: OFF</button>
</div>

<script>
//============================================================
// ALLY-SHORE
// Strategic campaign simulation for ABI
//============================================================

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 320, H = 180;

// Palette synced to ABI brand
const P = {
  bg: '#0F1822', bgMid: '#1C2938', bgLight: '#2A3B4F',
  gold: '#C9A961', goldDim: '#8A7440',
  bone: '#E8E2D0', boneDim: '#A8A290',
  amber: '#D97706', teal: '#4A8B7E', red: '#8B2A2A',
  white: '#fff', black: '#000',
  ally: '#4A8B7E', adversary: '#8B2A2A'
};

//============================================================
// AUDIO: chiptune, deliberate strategic tone
//============================================================
let audioCtx = null;
let musicTimer = null;
let musicOn = false;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function tone(freq, dur, type = 'square', vol = 0.05, when = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + when;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}

function noise(dur, vol = 0.04, when = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + when;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();
  src.buffer = buf;
  gain.gain.setValueAtTime(vol, t);
  src.connect(gain).connect(audioCtx.destination);
  src.start(t);
}

// Note frequencies
const N = {
  A2:110.0,C3:130.8,D3:146.8,E3:164.8,F3:174.6,G3:196.0,A3:220.0,B3:246.9,
  C4:261.6,D4:293.7,E4:329.6,F4:349.2,G4:392.0,A4:440.0,B4:493.9,
  C5:523.3,D5:587.3,E5:659.3,F5:698.5,G5:784.0,A5:880.0
};

// Slow deliberate theme in A minor. Sparse. Strategic.
const melody = [
  ['A4',4],['E4',2],['A4',2],
  ['C5',4],['B4',2],['A4',2],
  ['G4',4],['D4',2],['G4',2],
  ['F4',4],['E4',2],['null',2],
  ['A4',4],['C5',2],['E5',2],
  ['D5',4],['B4',2],['G4',2],
  ['F4',4],['E4',4],
  ['A4',4],['null',4]
];
const bass = [
  ['A2',8],['A2',8],
  ['F3',8],['F3',8],
  ['G3',8],['G3',8],
  ['A2',8],['A2',8]
];

function playMusic() {
  if (!audioCtx || !musicOn) return;
  const stepDur = 0.14;
  let mIdx = 0, mAcc = 0;
  let bIdx = 0, bAcc = 0;
  const totalSteps = 64;

  for (let s = 0; s < totalSteps; s++) {
    if (mAcc === 0) {
      const note = melody[mIdx % melody.length];
      if (note[0] !== 'null') tone(N[note[0]], stepDur * note[1] * 0.85, 'square', 0.035, s * stepDur);
    }
    mAcc++;
    if (mAcc >= melody[mIdx % melody.length][1]) { mAcc = 0; mIdx++; }

    if (bAcc === 0) {
      const note = bass[bIdx % bass.length];
      if (note[0] !== 'null') tone(N[note[0]] / 2, stepDur * note[1] * 0.85, 'triangle', 0.06, s * stepDur);
    }
    bAcc++;
    if (bAcc >= bass[bIdx % bass.length][1]) { bAcc = 0; bIdx++; }
  }
  musicTimer = setTimeout(playMusic, totalSteps * stepDur * 1000);
}

function toggleMusic() {
  initAudio();
  musicOn = !musicOn;
  document.getElementById('audio-btn').textContent = musicOn ? '♪ AUDIO: ON' : '♪ AUDIO: OFF';
  if (musicOn) playMusic();
  else clearTimeout(musicTimer);
}
document.getElementById('audio-btn').addEventListener('click', toggleMusic);

const sfx = {
  click: () => tone(660, 0.04, 'square', 0.03),
  good: () => { tone(523, 0.08, 'square', 0.05); tone(784, 0.12, 'square', 0.05, 0.06); },
  bad: () => { tone(180, 0.18, 'sawtooth', 0.06); tone(140, 0.25, 'sawtooth', 0.05, 0.08); },
  alert: () => { tone(880, 0.06, 'square', 0.05); tone(880, 0.06, 'square', 0.05, 0.1); },
  milestone: () => { tone(523, 0.1, 'square', 0.05); tone(659, 0.1, 'square', 0.05, 0.08); tone(784, 0.2, 'square', 0.05, 0.16); }
};

//============================================================
// PIXEL HELPERS
//============================================================
function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x | 0, y | 0, w | 0, h | 0);
}

function drawSprite(sprite, x, y, scale, palette) {
  for (let row = 0; row < sprite.length; row++) {
    for (let col = 0; col < sprite[row].length; col++) {
      const c = sprite[row][col];
      if (c === '.') continue;
      const color = palette[c] || c;
      px(x + col * scale, y + row * scale, scale, scale, color);
    }
  }
}

// Basic 4x6 pixel font
const FONT = {
  'A':['.GG.','G..G','GGGG','G..G','G..G','....'],
  'B':['GGG.','G..G','GGG.','G..G','GGG.','....'],
  'C':['.GGG','G...','G...','G...','.GGG','....'],
  'D':['GGG.','G..G','G..G','G..G','GGG.','....'],
  'E':['GGGG','G...','GGG.','G...','GGGG','....'],
  'F':['GGGG','G...','GGG.','G...','G...','....'],
  'G':['.GGG','G...','G.GG','G..G','.GGG','....'],

  'J':['GGGG','...G','...G','G..G','.GG.','....'],
  'K':['G..G','G.G.','GG..','G.G.','G..G','....'],

  'N':['G..G','GG.G','G.GG','G..G','G..G','....'],
  'O':['.GG.','G..G','G..G','G..G','.GG.','....'],
  'P':['GGG.','G..G','GGG.','G...','G...','....'],
  'Q':['.GG.','G..G','G..G','G.GG','.GGG','....'],
  'R':['GGG.','G..G','GGG.','G.G.','G..G','....'],
  'S':['.GGG','G...','.GG.','...G','GGG.','....'],
  'T':['GGGG','.GG.','.GG.','.GG.','.GG.','....'],
  'U':['G..G','G..G','G..G','G..G','.GG.','....'],
  'V':['G..G','G..G','G..G','.GG.','.GG.','....'],
  'W':['G..G','G..G','GGGG','GGGG','G..G','....'],
  'X':['G..G','.GG.','.GG.','.GG.','G..G','....'],
  'Y':['G..G','G..G','.GG.','.GG.','.GG.','....'],
  'Z':['GGGG','...G','.GG.','G...','GGGG','....'],
  '0':['.GG.','G..G','G..G','G..G','.GG.','....'],
  '1':['.GG.','GGG.','.GG.','.GG.','GGGG','....'],
  '2':['GGG.','...G','.GG.','G...','GGGG','....'],
  '3':['GGG.','...G','.GG.','...G','GGG.','....'],
  '4':['G..G','G..G','GGGG','...G','...G','....'],
  '5':['GGGG','G...','GGG.','...G','GGG.','....'],
  '6':['.GGG','G...','GGG.','G..G','.GG.','....'],
  '7':['GGGG','...G','..G.','.G..','G...','....'],
  '8':['.GG.','G..G','.GG.','G..G','.GG.','....'],
  '9':['.GG.','G..G','.GGG','...G','GGG.','....'],
  '.':['....','....','....','....','.G..','....'],
  ',':['....','....','....','.G..','G...','....'],
  '!':['.G..','.G..','.G..','....','.G..','....'],
  '?':['GGG.','...G','.GG.','....','.G..','....'],
  ':':['....','.G..','....','.G..','....','....'],
  '-':['....','....','GGGG','....','....','....'],
  '/':['...G','..G.','.G..','G...','....','....'],
  ' ':['....','....','....','....','....','....']
};

function drawText(str, x, y, color, scale = 1) {
  let cx = x;
  for (const ch of str.toUpperCase()) {
    const glyph = FONT[ch] || FONT[' '];
    for (let r = 0; r < glyph.length; r++) {
      for (let c = 0; c < glyph[r].length; c++) {
        if (glyph[r][c] === 'G') {
          px(cx + c * scale, y + r * scale, scale, scale, color);
        }
      }
    }
    cx += 5 * scale;
  }
}

function textWidth(str, scale = 1) { return str.length * 5 * scale; }
function drawTextCenter(str, y, color, scale = 1) {
  drawText(str, (W - textWidth(str, scale)) / 2, y, color, scale);
}

//============================================================
// SPRITES (pixel art for ABI campaign visuals)
//============================================================

// Capitol building silhouette (40x24)
const CAPITOL = [
  '..............GGGGGG............',
  '.............GGGGGGGG...........',
  '............GGGGGGGGGG..........',
  '...........GGGG.GG.GGGG.........',
  '..........GGGGG.GG.GGGGG........',
  '..........GGGGG.GG.GGGGG........',
  '..........GGGGGGGGGGGGGGG.......',
  'GG......GGGGGGGGGGGGGGGGGGG..GG.',
  'GG.GGGGGGGGGGGGGGGGGGGGGGGGGGGG.',
  'GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG',
  'G.GG.GG.GG.GG.GG.GG.GG.GG.GG.GG.',
  'G.GG.GG.GG.GG.GG.GG.GG.GG.GG.GG.',
  'G.GG.GG.GG.GG.GG.GG.GG.GG.GG.GG.',
  'G.GG.GG.GG.GG.GG.GG.GG.GG.GG.GG.',
  'GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG',
  'GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG'
];

// Globe with ally network nodes (24x24)
const GLOBE = [
  '........GGGGGGGG........',
  '.....GGG........GGG.....',
  '...GG..............GG...',
  '..G..G.G.G.G.G.G.G..G..',
  '.G..GGGGGGGGGGGGGGG..G.',
  '.G.G..............G.G.',
  'G.G.GGGGGGGGGGGGGG.G.G',
  'G.G..............G.G.G',

//============================================================
// SCENE DRAWING
//============================================================
let anim = 0;

function drawBackground() {
  // Deep blue bg
  px(0, 0, W, H, P.bg);
  // Subtle grid lines
  ctx.fillStyle = '#1a2535';
  for (let x = 0; x < W; x += 16) px(x, 0, 1, H, '#1a2535');
  for (let y = 0; y < H; y += 16) px(0, y, W, 1, '#1a2535');
  // Top accent line
  px(0, 0, W, 2, P.goldDim);
  px(0, H - 2, W, 2, P.goldDim);
}

function drawScanLine() {
  // Scanline effect
  const y = (anim * 2) % H;
  ctx.fillStyle = 'rgba(201, 169, 97, 0.04)';
  ctx.fillRect(0, y, W, 1);
}

function drawTitleScene() {
  drawBackground();

  // Globe centered, rotating ally nodes
  drawSprite(GLOBE, 148, 30, 1, { G: P.gold });

  // Orbit dots representing ally nations
  for (let i = 0; i < 6; i++) {
    const angle = (anim * 0.03 + i * Math.PI / 3);
    const ox = 160 + Math.cos(angle) * 36;
    const oy = 51 + Math.sin(angle) * 22;
    px(ox - 1, oy - 1, 2, 2, P.teal);
  }

  drawTextCenter('ALLY-SHORE', 100, P.bone, 2);
  drawTextCenter('STRATEGIC CAMPAIGN SIMULATION', 122, P.boneDim, 1);
  drawTextCenter('ABI OPERATIONS', 138, P.gold, 1);

  // Pulsing prompt
  if (anim % 60 < 40) {
    drawTextCenter('PRESS BEGIN BRIEFING', 158, P.bone, 1);
  }

  drawScanLine();
}

function drawCampaignScene() {
  drawBackground();

  // Capitol silhouette in distance
  drawSprite(CAPITOL, 150, 30, 2, { G: P.bgLight });

  // Stars/connection nodes representing coalition
  const nodes = [
    [40, 60], [80, 80], [50, 110], [90, 130], [30, 90]
  ];
  // draw connecting lines between nodes
  ctx.strokeStyle = P.goldDim;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < nodes.length - 1; i++) {
    ctx.moveTo(nodes[i][0], nodes[i][1]);
    ctx.lineTo(nodes[i + 1][0], nodes[i + 1][1]);
  }
  ctx.stroke();

  // draw nodes
  state.coalition.forEach((m, i) => {
    const [x, y] = nodes[i];
    const color = m.cred < 30 ? P.red : m.cred < 60 ? P.amber : P.teal;
    px(x - 2, y - 2, 4, 4, color);
    if (anim % 40 < 30) px(x - 3, y - 3, 6, 6, color);
  });

  // Progress indicator at bottom
  const prog = state.progress;
  px(20, 160, 280, 4, P.bgLight);
  px(20, 160, 280 * (prog / 100), 4, P.gold);

  // milestone markers
  const milestones = [10, 25, 40, 55, 70, 85];
  milestones.forEach(m => {
    const mx = 20 + 280 * (m / 100);
    const hit = prog >= m;
    px(mx - 1, 158, 2, 8, hit ? P.gold : P.boneDim);
  });

  drawText('CAMPAIGN PROGRESS', 20, 150, P.boneDim, 1);
  drawText('WEEK ' + state.week, 240, 150, P.gold, 1);

  // Title indicator
  drawText('OPERATION: ALLY-SHORE', 20, 12, P.gold, 1);
  drawText('STATUS: ACTIVE', 220, 12, P.teal, 1);

  drawScanLine();
}

function drawEventScene() {
  drawBackground();

  // Different visuals based on event type
  const e = state.currentEvent;
  if (!e) return;

  const type = e.icon || 'doc';

  if (type === 'doc') {
    drawSprite(DOC, 150, 40, 3, { G: P.gold });
  } else if (type === 'mic') {
    drawSprite(MIC, 152, 40, 3, { G: P.amber });
  } else if (type === 'figure') {
    drawSprite(FIGURE, 152, 40, 3, { G: P.bone });
  } else if (type === 'camera') {
    drawSprite(CAMERA, 150, 50, 3, { G: P.red });
  } else if (type === 'briefcase') {
    drawSprite(BRIEFCASE, 148, 50, 3, { G: P.teal });
  } else if (type === 'capitol') {
    drawSprite(CAPITOL, 152, 50, 2, { G: P.bone });
  }

  // Alert banner
  px(0, 8, W, 14, P.bgMid);
  px(0, 8, W, 1, P.gold);
  px(0, 22, W, 1, P.gold);
  drawTextCenter('INCOMING SIGNAL', 12, P.gold, 1);

  // Alert dot
  if (anim % 30 < 15) {
    px(8, 14, 4, 4, P.amber);
    px(W - 12, 14, 4, 4, P.amber);
  }

  drawScanLine();
}

function drawEndScene() {
  drawBackground();
  const r = state.result;

  let color = P.gold, headline = 'CAMPAIGN COMPLETE';
  if (r === 'clean') { color = P.teal; headline = 'CLEAN PASSAGE'; }
  else if (r === 'adopted') { color = P.gold; headline = 'FRAMEWORK ADOPTED'; }
  else if (r === 'fractured') { color = P.red; headline = 'COALITION FRACTURED'; }
  else if (r === 'captured') { color = P.amber; headline = 'FRAME CAPTURED'; }
  else if (r === 'abandoned') { color = P.red; headline = 'CAMPAIGN ABANDONED'; }
  else if (r === 'partial') { color = P.gold; headline = 'PARTIAL VICTORY'; }

  // Big result text
  drawTextCenter(headline, 30, color, 2);
  drawTextCenter('OPERATION CONCLUDED', 56, P.boneDim, 1);

  // Stats
  let y = 80;
  const stats = [
    ['WEEKS ELAPSED', state.week],
    ['BUDGET REMAINING', '$' + state.budget + 'K'],
    ['POLITICAL CAPITAL', state.pc],
    ['COHESION', state.cohesion + '%'],
    ['FRAME INTEGRITY', state.frame + '%']
  ];
  stats.forEach(s => {
    drawText(s[0], 40, y, P.boneDim, 1);
    drawText(String(s[1]), 220, y, P.bone, 1);
    y += 12;
  });

  drawScanLine();
}

function rollEvent() {
  const totalWeight = EVENTS.reduce((s, e) => s + e.weight, 0);
  let r = Math.random() * totalWeight;
  for (const e of EVENTS) {
    r -= e.weight;
    if (r <= 0) return JSON.parse(JSON.stringify({ ...e, choices: e.choices.map(c => ({ label: c.label, sub: c.sub, fnRef: EVENTS.indexOf(e) + '_' + e.choices.indexOf(c) })) }));
  }
  return EVENTS[0];
}

function applyChoiceEffect(event, choiceIdx) {
  const original = EVENTS.find(e => e.id === event.id);
  if (original && original.choices[choiceIdx]) {
    original.choices[choiceIdx].effect();
  }
}

// GAME ACTIONS
//============================================================
function advanceLeg() {
  state.week += 1;
  // Resource consumption by pace and posture
  const paceCost = { cautious: { budget: 4, pc: 1, cohesion: 1, progress: 4 },
                     steady: { budget: 6, pc: 2, cohesion: 0, progress: 7 },
                     aggressive: { budget: 10, pc: 4, cohesion: -3, progress: 12 } };
  const postureCost = { background: { cohesion: 2, visibility: -2 },
                        engaged: { cohesion: 0, visibility: 0 },
                        highvis: { cohesion: -3, visibility: 4 } };
  const p = paceCost[state.pace];
  const po = postureCost[state.posture];

  state.budget -= p.budget;
  state.pc -= p.pc;
  state.cohesion += (p.cohesion + po.cohesion);
  state.progress += p.progress;

  // Visibility affects event probability (high vis = more events)
  let eventChance = 0.55 + (po.visibility * 0.05);
  if (state.pace === 'aggressive') eventChance += 0.1;

  // Clamp values
  state.cohesion = Math.max(0, Math.min(100, state.cohesion));
  state.pc = Math.max(0, Math.min(100, state.pc));
  state.frame = Math.max(0, Math.min(100, state.frame));
  state.progress = Math.min(100, state.progress);

  // Milestone hits
  const milestones = [10, 25, 40, 55, 70, 85, 100];
  for (const m of milestones) {
    if (state.progress >= m && !state.milestonesHit.has(m)) {
      state.milestonesHit.add(m);
      const labels = {
        10: 'WHITE PAPER RELEASED',
        25: 'FIRST HILL BRIEFING COMPLETE',
        40: 'OP-ED PLACED IN MAJOR OUTLET',
        55: 'COMMITTEE HEARING SCHEDULED',
        70: 'MARKUP UNDERWAY',
        85: 'FLOOR ACTION IMMINENT',
        100: 'FRAMEWORK ADOPTED'
      };
      log('★ ' + labels[m], 'good');
      sfx.milestone();
    }
  }

  // Check end conditions
  if (checkEndState()) return;

  // Trigger event probabilistically
  if (Math.random() < eventChance) {
    state.currentEvent = rollEvent();
    state.scene = 'event';
    sfx.alert();
  }

  render();
}

function checkEndState() {
  if (state.progress >= 100) {
    if (state.frame >= 70 && state.cohesion >= 60) {
      state.result = 'clean';
    } else if (state.frame >= 40) {
      state.result = 'adopted';
    } else {
      state.result = 'captured';
    }
    state.scene = 'end';
    return true;
  }
  if (state.cohesion <= 0) {
    state.result = 'fractured'; state.scene = 'end'; return true;
  }
  if (state.budget <= 0) {
    state.result = 'abandoned'; state.scene = 'end'; return true;
  }
  if (state.week >= 40) {
    if (state.progress >= 55) state.result = 'partial';
    else state.result = 'abandoned';
    state.scene = 'end'; return true;
  }
  if (state.frame <= 0) {
    state.result = 'captured'; state.scene = 'end'; return true;
  }
  return false;
}

function chooseEventOption(idx) {
  const e = state.currentEvent;
  applyChoiceEffect(e, idx);

  // Clamp again
  state.cohesion = Math.max(0, Math.min(100, state.cohesion));
  state.pc = Math.max(0, Math.min(100, state.pc));
  state.frame = Math.max(0, Math.min(100, state.frame));
  state.progress = Math.max(0, Math.min(100, state.progress));
  state.coalition.forEach(m => m.cred = Math.max(0, Math.min(100, m.cred)));

  state.currentEvent = null;
  if (!checkEndState()) {
    state.scene = 'campaign';
    sfx.click();
  }
  render();
}

function startGame() {
  state.scene = 'campaign';
  initCoalition();
  log('Campaign initiated. Coalition assembled.', 'good');
  if (!musicOn) toggleMusic();
  render();
}

function restart() {
  Object.assign(state, {
    scene: 'title', budget: 100, pc: 50, briefings: 8, intel: 5,
    cohesion: 80, frame: 100, progress: 0, week: 0,
    pace: 'steady', posture: 'engaged', coalition: [],
    currentEvent: null, log: [], result: null, milestonesHit: new Set()
  });
  render();
}

        <br><br>
        Manage your coalition. Allocate budget and political capital. Respond to events as they break. The frame must hold.
      </div>

  } else if (state.scene === 'end') {
    hud.innerHTML = `<div style="text-align: center; color: var(--abi-gold); font-family: 'Bebas Neue'; font-size: 14px; letter-spacing: 4px;">CAMPAIGN ARCHIVED</div>`;
  } else {
    const cohesionClass = state.cohesion < 30 ? 'danger' : state.cohesion < 50 ? 'warn' : 'good';
    const frameClass = state.frame < 30 ? 'danger' : state.frame < 60 ? 'warn' : 'good';
    const budgetClass = state.budget < 20 ? 'danger' : state.budget < 40 ? 'warn' : '';
    const pcClass = state.pc < 20 ? 'danger' : state.pc < 40 ? 'warn' : '';

    hud.innerHTML = `
      <div class="hud-grid">
        <div class="hud-row"><span class="k">BUDGET</span><span class="v ${budgetClass}">$${state.budget}K</span></div>
        <div class="hud-row"><span class="k">POL. CAPITAL</span><span class="v ${pcClass}">${state.pc}</span></div>
        <div class="hud-row"><span class="k">COHESION</span><span class="v ${cohesionClass}">${state.cohesion}%</span></div>
        <div class="hud-row"><span class="k">FRAME INTEGRITY</span><span class="v ${frameClass}">${state.frame}%</span></div>
        <div class="hud-row"><span class="k">BRIEFINGS</span><span class="v">${state.briefings}</span></div>
        <div class="hud-row"><span class="k">INTEL REPORTS</span><span class="v">${state.intel}</span></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-label">
          <span>CAMPAIGN PROGRESS</span>
          <span>WEEK ${state.week} / 40</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${state.progress}%"></div></div>
        <div class="milestones">
          <span class="milestone ${state.milestonesHit.has(10)?'hit':''}">PAPER</span>
          <span class="milestone ${state.milestonesHit.has(25)?'hit':''}">BRIEF</span>
          <span class="milestone ${state.milestonesHit.has(40)?'hit':''}">OP-ED</span>
          <span class="milestone ${state.milestonesHit.has(55)?'hit':''}">HEARING</span>
          <span class="milestone ${state.milestonesHit.has(70)?'hit':''}">MARKUP</span>
          <span class="milestone ${state.milestonesHit.has(85)?'hit':''}">FLOOR</span>
          <span class="milestone ${state.milestonesHit.has(100)?'hit':''}">ADOPT</span>
        </div>
      </div>
      <div class="coalition">
        ${state.coalition.map(m => {
          const cls = m.cred <= 0 ? 'gone' : m.cred < 40 ? 'weak' : '';
          return `<div class="member ${cls}"><div class="role">${m.role}</div><div class="cred">${m.cred}</div></div>`;
        }).join('')}
      </div>
      ${state.log.slice(0, 2).map(l => `<div class="status-msg ${l.kind}">W${l.week}: ${l.msg}</div>`).join('')}
    `;
  }

  // Render controls
  const c = document.getElementById('controls');
  if (state.scene === 'title') {
    c.innerHTML = `
      <button class="primary" onclick="startGame()">BEGIN BRIEFING <span class="sub">Initialize coalition and start campaign</span></button>
    `;
  } else if (state.scene === 'campaign') {
    c.innerHTML = `
      <div class="event-text">
        <span class="tag">DIRECTIVE</span>
        Set campaign tempo and posture for this leg. Each leg consumes resources. Higher tempo and visibility accelerate progress but generate more incoming events.
      </div>
      <div style="font-size:10px; color: var(--abi-bone-dim); letter-spacing:2px; margin-bottom:4px;">PACE</div>
      <div class="btn-grid cols-3" style="margin-bottom:8px;">
        <button class="${state.pace==='cautious'?'primary':''}" onclick="setPace('cautious')">CAUTIOUS<span class="sub">Slow, cheap, low risk</span></button>
        <button class="${state.pace==='steady'?'primary':''}" onclick="setPace('steady')">STEADY<span class="sub">Balanced burn rate</span></button>
        <button class="${state.pace==='aggressive'?'primary':''}" onclick="setPace('aggressive')">AGGRESSIVE<span class="sub">Fast, costly, attracts heat</span></button>
      </div>
      <div style="font-size:10px; color: var(--abi-bone-dim); letter-spacing:2px; margin-bottom:4px;">POSTURE</div>
      <div class="btn-grid cols-3" style="margin-bottom:10px;">
        <button class="${state.posture==='background'?'primary':''}" onclick="setPosture('background')">BACKGROUND<span class="sub">Quiet work, preserves cohesion</span></button>
        <button class="${state.posture==='engaged'?'primary':''}" onclick="setPosture('engaged')">ENGAGED<span class="sub">Standard public presence</span></button>
        <button class="${state.posture==='highvis'?'primary':''}" onclick="setPosture('highvis')">HIGH-VIS<span class="sub">Press-forward, draws fire</span></button>
      </div>
      <button class="primary" onclick="advanceLeg()">ADVANCE ONE WEEK <span class="sub">Execute leg with current settings</span></button>
    `;
  } else if (state.scene === 'event') {
    const e = state.currentEvent;
    c.innerHTML = `
      <div class="event-text">
        <span class="tag">EVENT // ${e.id.toUpperCase().replace(/_/g,' ')}</span>
        ${e.text}
      </div>
      <div class="btn-grid">
        ${e.choices.map((ch, i) => `
          <button onclick="chooseEventOption(${i})">${ch.label}<span class="sub">${ch.sub}</span></button>
        `).join('')}
      </div>
    `;
  } else if (state.scene === 'end') {
    const labels = {
      clean: 'You moved a comprehensive ally-shoring framework through with the frame intact and coalition aligned. A rare execution.',
      adopted: 'The framework was absorbed into a larger national security vehicle. The frame survived. Most realistic win condition.',
      fractured: 'The coalition came apart. Internal disagreements outpaced unifying pressure. Restart with tighter cohesion management.',
      captured: 'The ally-shoring frame was overtaken by domestic-only reshoring. A win on paper, a loss in substance.',
      abandoned: 'Resources depleted before reaching critical mass. Consider a more disciplined burn rate.',
      partial: 'Time ran out short of full enactment. Provisions live on, but the major vehicle did not move.'
    };
    c.innerHTML = `
      <div class="event-text">
        <span class="tag">DEBRIEF</span>
        ${labels[state.result]}
      </div>
      <button class="primary" onclick="restart()">RUN NEW SIMULATION<span class="sub">Reset all variables</span></button>
    `;
  }
}

// Expose functions to window for inline handlers
window.startGame = startGame;
window.setPace = (p) => { state.pace = p; sfx.click(); render(); };
window.setPosture = (p) => { state.posture = p; sfx.click(); render(); };
window.advanceLeg = advanceLeg;
window.chooseEventOption = chooseEventOption;
window.restart = restart;

// Animation loop
function loop() {
  anim++;
  if (state.scene === 'title' || anim % 4 === 0) render();
  requestAnimationFrame(loop);
}

render();
loop();
</script>
</body>
</html>
