<html lang="en">
<head>

<title>2035 // The Biosecurity Balance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --slate: #14202E;
    --slate-deep: #0D1620;
    --panel: #1C2B3A;
    --panel-light: #283B4E;
    --bone: #EAE4D6;
    --bone-dim: #8C99A6;
    --gold: #C9A961;
    --gold-dim: #8A7440;
    --innov: #4FB0C6;
    --secure: #C9A961;
    --afford: #7DBE8A;
    --red: #C0524A;
    --line: rgba(201,169,97,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--slate-deep);
    color: var(--bone);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  body { display: flex; flex-direction: column; align-items: center; padding: 14px 12px 28px; }

  .topbar {
    width: 100%; max-width: 700px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 14px; background: var(--slate);
    border: 1px solid var(--gold-dim); border-bottom: none;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 2px; color: var(--gold); text-transform: uppercase;
  }
  .topbar .right { color: var(--bone-dim); }

  .title-bar {
    width: 100%; max-width: 700px; background: var(--slate);
    border-left: 1px solid var(--gold-dim); border-right: 1px solid var(--gold-dim);
    padding: 16px 16px 12px; text-align: center;
  }
  .title-bar h1 {
    font-family: 'Bebas Neue', sans-serif; font-size: 46px;
    letter-spacing: 10px; color: var(--bone); line-height: 1;
  }
  .title-bar h1 span { color: var(--gold); }
  .title-bar .sub {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 3px; color: var(--bone-dim); margin-top: 7px; text-transform: uppercase;
  }

  #stage {
    width: 100%; max-width: 700px;
    border-left: 1px solid var(--gold-dim); border-right: 1px solid var(--gold-dim);
    background: var(--slate-deep); padding: 12px;

  canvas {
    width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; display: block; border: 1px solid var(--gold-dim);

    width: 100%; max-width: 700px; background: var(--slate);
    border: 1px solid var(--gold-dim); border-top: none; padding: 12px 14px;
  }
  .meters { display: grid; gap: 10px; }
  .meter .head {
    display: flex; justify-content: space-between; align-items: baseline;

    text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px;

  .meter .head .name { color: var(--bone); }
  .meter .head .val { font-weight: 700; font-size: 13px; }
  .meter .bar {
    height: 14px; background: var(--slate-deep);
    border: 1px solid var(--panel-light); position: relative; overflow: hidden;
  }
  .meter .fill { height: 100%; transition: width 0.5s ease-out, background 0.3s; }
  .meter .thresh {

    background: var(--bone-dim); opacity: 0.6;
  }
  .meter.innov .val { color: var(--innov); }
  .meter.innov .fill { background: linear-gradient(90deg, #2C6B7A, var(--innov)); }
  .meter.secure .val { color: var(--secure); }
  .meter.secure .fill { background: linear-gradient(90deg, var(--gold-dim), var(--secure)); }
  .meter.afford .val { color: var(--afford); }
  .meter.afford .fill { background: linear-gradient(90deg, #4A7A56, var(--afford)); }
  .meter .fill.low { background: var(--red) !important; }

  .delta {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    margin-left: 6px; opacity: 0; transition: opacity 0.2s;
  }
  .delta.show { opacity: 1; }
  .delta.up { color: var(--afford); }
  .delta.down { color: var(--red); }

  #controls {
    width: 100%; max-width: 700px; background: var(--slate);
    border: 1px solid var(--gold-dim); border-top: none; padding: 12px;

  .scenario {
    background: var(--slate-deep); border-left: 3px solid var(--gold);

    display: inline-block; padding: 2px 7px; background: var(--gold);

  button .sub {
    display: block; font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px; letter-spacing: 0.3px; color: var(--bone-dim);

  button:hover:not(:disabled) { border-color: var(--gold); background: var(--panel); transform: translateY(-1px); }

    margin-top: 10px; padding: 9px 12px; font-family: 'Barlow Condensed', sans-serif;

    background: var(--slate-deep); color: var(--bone);

  .notice .lbl {
    display: block; font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--bone-dim); margin-bottom: 3px;

  .footer {

<script>

// 2035 // THE BIOSECURITY BALANCE
//============================================================

//============================================================
// AUDIO ENGINE (hardened for iOS)
//============================================================
let audioCtx = null, musicOn = false, musicTimer = null;

function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return false; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return true;
}

function tone(freq, dur, type='square', vol=0.05, when=0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + when;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.05);
}

const NF = {
  A2:110.0,C3:130.8,D3:146.8,E3:164.8,F3:174.6,G3:196.0,A3:220.0,B3:246.9,
  C4:261.6,D4:293.7,E4:329.6,F4:349.2,G4:392.0,A4:440.0,B4:493.9,C5:523.3,D5:587.3,E5:659.3
};
// Reflective, steady theme. A minor.
const MEL = [
  ['A4',4],['C5',2],['B4',2],['A4',4],['E4',4],
  ['F4',4],['A4',2],['G4',2],['F4',4],['E4',4],
  ['D4',4],['F4',2],['E4',2],['D4',4],['A3',4],
  ['C4',4],['E4',2],['G4',2],['A4',8]
];
const BASS = [['A2',8],['A2',8],['F3',8],['F3',8],['D3',8],['D3',8],['A2',8],['A2',8]];

function playMusic() {
  if (!audioCtx || !musicOn) return;
  const step = 0.16;
  let mi=0, ma=0, bi=0, ba=0;
  const steps = 80;
  for (let s=0; s<steps; s++) {
    if (ma===0) { const n = MEL[mi%MEL.length]; if (n[0]!=='r') tone(NF[n[0]], step*n[1]*0.85, 'square', 0.035, s*step); }
    ma++; if (ma>=MEL[mi%MEL.length][1]) { ma=0; mi++; }
    if (ba===0) { const n = BASS[bi%BASS.length]; if (n[0]!=='r') tone(NF[n[0]]/2, step*n[1]*0.85, 'triangle', 0.055, s*step); }
    ba++; if (ba>=BASS[bi%BASS.length][1]) { ba=0; bi++; }
  }
  musicTimer = setTimeout(playMusic, steps*step*1000);
}

function enableSound() {
  if (!ensureAudio()) return;
  musicOn = true;
  document.getElementById('audio-btn').textContent = '♪ SOUND: ON';
  // confirmation chord so the user hears it worked immediately
  tone(NF.A4, 0.18, 'square', 0.05, 0);
  tone(NF.C5, 0.18, 'square', 0.05, 0.04);
  tone(NF.E5, 0.3, 'square', 0.05, 0.08);
  clearTimeout(musicTimer);
  playMusic();
}
function disableSound() {
  musicOn = false;
  clearTimeout(musicTimer);
  document.getElementById('audio-btn').textContent = '♪ SOUND: OFF';
}
function toggleSound() { if (musicOn) disableSound(); else enableSound(); }
document.getElementById('audio-btn').addEventListener('click', toggleSound);

const sfx = {

  good:  () => { ensureAudio(); tone(523,0.09,'square',0.045); tone(784,0.13,'square',0.045,0.07); },
  bad:   () => { ensureAudio(); tone(180,0.2,'sawtooth',0.06); tone(120,0.28,'sawtooth',0.05,0.1); },
  turn:  () => { ensureAudio(); tone(392,0.08,'square',0.04); tone(523,0.1,'square',0.04,0.07); }
};

    if(sp[r][c]==='G') px(x+c*sc,y+r*sc,sc,sc,col);
  }
}

 '-':['..','..','GG','..','..'],'/':['..G','.G.','.G.','.G.','G..'],"'":['G','G','.','.','.'],
 ':':['.','G','.','G','.'],'!':['G','G','G','.','G']
};
function drawText(str,x,y,col,sc=1){
  let cx=x;
  for(const ch of str.toUpperCase()){
    const g=FONT[ch]||FONT[' '];
    for(let r=0;r<g.length;r++) for(let c=0;c<g[r].length;c++) if(g[r][c]==='G') px(cx+c*sc,y+r*sc,sc,sc,col);
    cx += (g[0].length+1)*sc;
  }
}
function textW(str,sc=1){ let w=0; for(const ch of str.toUpperCase()){ const g=FONT[ch]||FONT[' ']; w+=(g[0].length+1)*sc; } return w; }
function drawTextC(str,y,col,sc=1){ drawText(str,(W-textW(str,sc))/2,y,col,sc); }

      { label:'VETO, OFFER AN ALTERNATIVE', sub:'Push affordability through competition and patient relief instead.',
        fx:{i:1,s:1,a:6} },
      { label:'SIGN A TRIMMED VERSION', sub:'Keep modest caps, drop the overrides.',
        fx:{i:-4,a:9}, defer:{in:2, fx:{i:-8}, note:'Even the trimmed caps cooled long-term investment.'} }
    ]
  },
  {
    icon:'factory', tag:'CHOKEPOINT',
    headline:'A critical chemical building block is now made in only two places, one of them a rival. A shortage is forming.',
    choices:[
      { label:'BLOCK THE RIVAL NOW', sub:'Cut off the rival\'s supply immediately.',
        fx:{s:-3,a:-7}, defer:{in:1, fx:{s:-6}, note:'With no alternative ready, the block created the very shortage it was meant to prevent.'} },
      { label:'DUAL-SOURCE WITH ALLIES', sub:'Fund partner and domestic second sources in parallel.',
        fx:{s:10,a:-2} },
      { label:'STOCKPILE ONLY', sub:'Build a reserve without fixing the underlying source.',
        fx:{s:3,a:-3} }
    ]
  },
  {
    icon:'shield', tag:'STANDOFF',
    headline:'During a geopolitical standoff, an adversary halts exports of a key medicine precursor to apply pressure.',
    choices:[
      { label:'ACTIVATE ALLIED BACKUPS', sub:'Switch to the partner sources built up over the decade.',
        fx:{s:6,a:-2} },
      { label:'EMERGENCY RATIONING', sub:'Ration supply and scramble for substitutes.',
        fx:{i:-2,s:-3,a:-8} },
      { label:'CONCEDE THE LEVERAGE', sub:'Negotiate from a position of weakness.',
        fx:{s:-6,a:-4} }
    ]
  },
  {
    icon:'scale', tag:'THE RECKONING',
    headline:'A national review tallies the decade\'s medical breakthroughs, or the absence of them, and asks what comes next.',
    choices:[
      { label:'RECOMMIT TO INNOVATION', sub:'Lock in long-term research stability and predictable rules.',
        fx:{i:8,s:1} },
      { label:'STAY THE COURSE', sub:'Hold current policy steady into the next decade.',
        fx:{} },
      { label:'CHASE SHORT-TERM SAVINGS', sub:'Divert research funds to immediate rebates.',
        fx:{i:-9,a:5} }
    ]
  }
];

//============================================================
// SCENE DRAWING
//============================================================
let anim = 0;

function bg() {
  px(0,0,W,H,C.bg);
  for(let x=0;x<W;x+=16) px(x,0,1,H,'#18283a');
  for(let y=0;y<H;y+=16) px(0,y,W,1,'#18283a');
  px(0,0,W,2,C.goldDim); px(0,H-2,W,2,C.goldDim);
}
function scan(){ ctx.fillStyle='rgba(201,169,97,0.035)'; ctx.fillRect(0,(anim*2)%H,W,1); }

function drawTitle() {
  bg();
  // three rising pillars representing the three meters
  const cols = [C.innov, C.secure, C.afford];
  const labels = ['INNOV','SECURE','AFFORD'];
  for(let k=0;k<3;k++){
    const baseH = 30 + Math.sin(anim*0.04 + k*1.4)*8 + k*4;
    const x = 96 + k*48;
    px(x, 100-baseH, 26, baseH, cols[k]);
    px(x, 100-baseH, 26, 2, C.bone);
    drawText(labels[k], x + (26-textW(labels[k],1))/2, 106, C.boneDim, 1);
  }
  px(80, 100, 160, 1, C.goldDim);
  drawTextC('STEER THE NATION TO 2035', 18, C.bone, 2);
  drawTextC('KEEP ALL THREE ABOVE THE LINE', 122, C.gold, 1);
  if(anim%60<40) drawTextC('PRESS BEGIN', 135, C.bone, 1);
  scan();
}

function drawDecision() {
  bg();
  // year banner
  px(0,8,W,18,C.panel); px(0,8,W,1,C.gold); px(0,26,W,1,C.gold);
  drawTextC(String(state.year), 12, C.gold, 2);

  // scenario icon, centered
  const sc = SCENARIOS[state.turnIndex % SCENARIOS.length];
  const ic = ICONS[sc.icon] || ICONS.scale;
  const sp = ic[0];
  const scale = 5;
  const iw = sp[0].length*scale, ih = sp.length*scale;
  drawSprite(sp, (W-iw)/2, 44, scale, ic[1]);

  // progress dots for the decade
  const total = SCENARIOS.length;
  for(let k=0;k<total;k++){
    const dx = (W - total*10)/2 + k*10;
    px(dx, H-16, 6, 6, k < state.turnIndex ? C.gold : (k===state.turnIndex ? C.bone : C.panelL));
  }
  scan();
}

function drawEnd() {
  bg();
  const r = state.result;
  let col = C.gold, head = 'DECADE COMPLETE';
  if(r==='golden'){ col=C.afford; head='A GOLDEN DECADE'; }
  else if(r==='resilient'){ col=C.gold; head='RESILIENT NATION'; }
  else if(r==='innov'){ col=C.red; head='INNOVATION HOLLOWED'; }
  else if(r==='secure'){ col=C.red; head='SECURITY BREACHED'; }
  else if(r==='afford'){ col=C.red; head='ACCESS COLLAPSED'; }
  else if(r==='collapse'){ col=C.red; head='SYSTEM COLLAPSE'; }

  drawTextC(head, 24, col, 2);
  drawTextC('FINAL STANDING, 2035', 46, C.boneDim, 1);

  // three final bars
  const data = [['INNOVATION',state.m.i,C.innov],['SECURITY',state.m.s,C.secure],['AFFORDABILITY',state.m.a,C.afford]];
  let y = 64;
  data.forEach(d=>{
    drawText(d[0], 24, y, C.boneDim, 1);
    px(24, y+8, 200, 8, C.bgDeep);
    px(24, y+8, 200*(Math.max(0,d[1])/100), 8, d[1] < THRESH ? C.red : d[2]);
    px(24 + 200*(THRESH/100), y+6, 1, 12, C.bone);
    drawText(String(Math.round(d[1])), 230, y, d[2], 1);
    y += 26;
  });
  scan();
}

function drawCanvas() {
  if(state.scene==='title') drawTitle();
  else if(state.scene==='decision') drawDecision();
  else if(state.scene==='end') drawEnd();
}

//============================================================
// LOGIC
//============================================================
function clamp(v){ return Math.max(0, Math.min(100, v)); }

function applyFx(fx){
  if(!fx) return;
  if(fx.i) state.m.i = clamp(state.m.i + fx.i);
  if(fx.s) state.m.s = clamp(state.m.s + fx.s);
  if(fx.a) state.m.a = clamp(state.m.a + fx.a);
}

function checkCollapse(){
  if(state.m.i<=0){ state.result='innov'; return true; }
  if(state.m.s<=0){ state.result='secure'; return true; }
  if(state.m.a<=0){ state.result='afford'; return true; }
  return false;
}

function startGame(){
  state.scene='decision';
  state.year=START_YEAR;
  state.m={i:62,s:58,a:55};
  state.deferred=[];
  state.turnIndex=0;
  state.pendingNotices=[];
  state.result=null;
  if(!musicOn) enableSound();
  sfx.turn();
  renderUI();
}

function choose(idx){
  const sc = SCENARIOS[state.turnIndex % SCENARIOS.length];
  const ch = sc.choices[idx];
  const before = {...state.m};

  applyFx(ch.fx);
  state.pendingNotices = [];

  // schedule deferred effect
  if(ch.defer){
    state.deferred.push({ fireYear: state.year + ch.defer.in, fx: ch.defer.fx, note: ch.defer.note });
  }

  // immediate collapse check
  if(checkCollapse()){ state.scene='end'; sfx.bad(); renderUI(); return; }

  // advance the year, fire any matured deferred effects
  state.year += 1;
  state.turnIndex += 1;

  const matured = state.deferred.filter(d => d.fireYear <= state.year);
  state.deferred = state.deferred.filter(d => d.fireYear > state.year);
  matured.forEach(d => { applyFx(d.fx); state.pendingNotices.push(d.note); });

  if(checkCollapse()){ state.scene='end'; sfx.bad(); renderUI(); return; }

  // end of decade?
  if(state.turnIndex >= SCENARIOS.length){
    // fire any remaining deferred before final verdict
    state.deferred.forEach(d => { applyFx(d.fx); state.pendingNotices.push(d.note); });
    state.deferred = [];
    finalVerdict();
    state.scene='end';
    if(state.result==='golden'||state.result==='resilient') sfx.good(); else sfx.bad();
    renderUI();
    return;
  }

  if(state.pendingNotices.length) sfx.bad(); else sfx.turn();
  renderUI();
}

function finalVerdict(){
  const {i,s,a} = state.m;
  if(i<THRESH){ state.result='innov'; return; }
  if(s<THRESH){ state.result='secure'; return; }
  if(a<THRESH){ state.result='afford'; return; }
  if(i>=65 && s>=65 && a>=65) state.result='golden';
  else state.result='resilient';
}

function restart(){
  state.scene='title';
  state.m={i:62,s:58,a:55};
  state.deferred=[]; state.turnIndex=0; state.year=START_YEAR;
  state.pendingNotices=[]; state.result=null;
  renderUI();
}

//============================================================
// UI
//============================================================
function meterRow(cls,name,val){
  const low = val < THRESH;
  return `<div class="meter ${cls}">
    <div class="head"><span class="name">${name}</span><span class="val">${Math.round(val)}</span></div>
    <div class="bar">
      <div class="fill ${low?'low':''}" style="width:${Math.max(0,val)}%"></div>
      <div class="thresh" style="left:${THRESH}%"></div>
    </div>
  </div>`;
}

function renderUI(){
  drawCanvas();
  const hud = document.getElementById('hud');
  const ctrl = document.getElementById('controls');

  if(state.scene==='title'){
    hud.innerHTML = `<div class="intro">
      You hold a national seat at the table: a member, an appointee, a director of biosecurity. Over ten years you will face the pressures pulling at the nation's medicine supply and its capacity to invent.
      <br><br>
      Three things must survive to <b>2035</b>: <b>Innovation</b>, the power to create new cures. <b>Security</b>, a supply chain that holds under pressure. <b>Affordability</b>, access patients can actually reach.
      <br><br>
      They pull against each other. Easy answers buy one at the cost of another, and some bills come due years later. Keep all three above the line.
    </div>`;
    ctrl.innerHTML = `<div class="btn-grid"><button class="primary" onclick="startGame()">BEGIN<span class="sub">Take the seat. The decade starts in 2025.</span></button></div>`;
    return;
  }

  if(state.scene==='end'){
    const verdicts = {
      golden:'You threaded every pressure. Innovation, security, and access all stand strong. This is what disciplined balance looks like, and it is rare.',
      resilient:'You reached 2035 intact. Not flawless, but the nation can invent, withstand a shock, and keep medicine within reach. A real win.',
      innov:'The capacity to invent was traded away. Prices may have fallen for a while, but the cures that were never funded are the true cost. A nation that cannot invent cannot stay secure.',
      secure:'The supply chain broke under pressure. Whether from walling off the world or leaning on a single source, the lesson is the same: resilience comes from diversified, trusted supply, not from isolation.',
      afford:'Access collapsed. Innovation and security mean little if patients cannot reach the medicine. Balance was lost on the other side.',
      collapse:'The system gave way.'
    };
    hud.innerHTML = `<div class="meters">
      ${meterRow('innov','INNOVATION',state.m.i)}
      ${meterRow('secure','SECURITY',state.m.s)}
      ${meterRow('afford','AFFORDABILITY',state.m.a)}
    </div>`;
    ctrl.innerHTML = `
      <div class="scenario"><span class="tag">DEBRIEF // ${state.year}</span>
        <div class="headline">${verdicts[state.result]||verdicts.collapse}</div></div>
      <div class="btn-grid"><button class="primary" onclick="restart()">RUN THE DECADE AGAIN<span class="sub">Reset to 2025 and try a different path.</span></button></div>`;
    return;
  }

  // decision scene
  const sc = SCENARIOS[state.turnIndex % SCENARIOS.length];
  hud.innerHTML = `<div class="meters">
    ${meterRow('innov','INNOVATION',state.m.i)}
    ${meterRow('secure','SECURITY',state.m.s)}
    ${meterRow('afford','AFFORDABILITY',state.m.a)}
  </div>`;

  const notices = state.pendingNotices.map(n =>
    `<div class="notice"><span class="lbl">The bill comes due</span>${n}</div>`).join('');

  ctrl.innerHTML = `
    <div class="scenario">
      <span class="tag">${sc.tag} // ${state.year}</span>
      <div class="headline">${sc.headline}</div>
    </div>
    <div class="btn-grid">
      ${sc.choices.map((c,i)=>`<button onclick="choose(${i})">${c.label}<span class="sub">${c.sub}</span></button>`).join('')}
    </div>
    ${notices}`;
}

window.startGame = () => { sfx.click(); startGame(); };
window.choose = (i) => { sfx.click(); choose(i); };
window.restart = () => { sfx.click(); restart(); };

// animation: canvas only, never touches buttons
function loop(){ anim++; drawCanvas(); requestAnimationFrame(loop); }
renderUI();
loop();
</script>
